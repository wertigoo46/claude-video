<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="lib/dizzo-guy.js"></script>
<style>
  @font-face { font-family: Marker; src: url(lib/fonts/marker.woff2) format("woff2"); }
  @font-face { font-family: Anton; src: url(lib/fonts/anton.woff2) format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #root { position: relative; width: 1920px; height: 1080px; background: #000; overflow: hidden; }
  #cam { position: absolute; inset: 0; transform-origin: 960px 540px; }
  #spot { position: absolute; inset: 0; background: radial-gradient(ellipse 620px 560px at 960px 520px, #1b1b1b 0%, #070707 60%, #000 100%); }
  #floor { position: absolute; left: 0; right: 0; top: 1022px; height: 2px; background: linear-gradient(90deg, transparent, #555 30%, #555 70%, transparent); }
  .label { position: absolute; font-family: Marker; color: #fff; font-size: 76px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }
  .label.y { color: #ffd320; }
  .arrow { position: absolute; }
  #caption { position: absolute; left: 0; right: 0; top: 930px; text-align: center; font-family: Marker; font-size: 64px; color: #fff; text-transform: uppercase;
    text-shadow: 0 0 6px #000, 0 4px 0 #000, 0 -4px 0 #000, 4px 0 0 #000, -4px 0 0 #000; }
  #caption b { color: #ffd320; font-weight: 400; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1920" data-height="1080">
  <div id="scene" class="clip" data-start="0" data-duration="9" data-track-index="0" style="position:absolute;inset:0">
    <div id="cam"><div id="spot"></div><div id="floor"></div><div id="stage" style="position:absolute;inset:0"></div>
      <div class="label" id="l1" style="left:1290px;top:230px">Meet <span style="color:#ffd320">Dizzo</span></div>
      <svg class="arrow" id="a1" style="left:1160px;top:300px" width="150" height="120" viewBox="0 0 150 120"><path d="M140 10 Q 60 10 20 100" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M8 78 L 20 104 L 44 90" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="label y" id="l2" style="left:300px;top:300px">Bald.</div>
      <div class="label" id="l3" style="left:280px;top:420px">Strong.</div>
      <div class="label y" id="l4" style="left:250px;top:540px">Moving.</div>
    </div>
    <div id="caption"></div>
  </div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const D = 9;
  const tl = gsap.timeline({ paused: true });
  // fake voice envelope for the test (real episodes use the MP3 loudness)
  const env = []; for (let i = 0; i < D * 30; i++) { const t = i / 30; env.push(t > 0.9 && t < 8.4 ? Math.max(0, Math.sin(t * 17) * 0.5 + Math.sin(t * 7.3) * 0.4) : 0); }
  const guy = DizzoGuy.create(document.getElementById("stage"), { envelope: env, pose: { x: 960 } });
  const G = DizzoGuy.G;
  G.jumpIn(guy, tl, 0.05);
  G.wave(guy, tl, 1.0);
  tl.from("#l1", { opacity: 0, x: 40, duration: 0.3, ease: "back.out(2)" }, 1.1).from("#a1", { opacity: 0, scale: 0.6, duration: 0.3 }, 1.2);
  G.point(guy, tl, 3.0, "L");
  tl.from("#l2", { opacity: 0, x: -40, duration: 0.25 }, 3.1).from("#l3", { opacity: 0, x: -40, duration: 0.25 }, 3.4).from("#l4", { opacity: 0, x: -40, duration: 0.25 }, 3.7);
  guy.rest(tl, 0.4, 4.4);
  tl.to(["#l1", "#a1", "#l2", "#l3", "#l4"], { opacity: 0, duration: 0.3 }, 4.5);
  G.flex(guy, tl, 4.9, 1.0);
  tl.to("#cam", { scale: 1.12, duration: 1.3, ease: "power2.inOut" }, 4.9);
  G.curl(guy, tl, 6.8, 1, "R");
  tl.to("#cam", { scale: 2.6, y: 880, duration: 1.0, ease: "power3.inOut" }, 7.6);
  // captions (word timings come from the transcript in real episodes)
  const words = [[0.9,"WHAT'S"],[1.2,"UP"],[1.45,"GUYS,"],[1.9,"I'M"],[2.1,"THE"],[2.3,"<b>DIZZO</b>"],[2.75,"GUY."],[3.1,"BALD,"],[3.5,"STRONG,"],[3.9,"AND"],[4.1,"ALWAYS"],[4.5,"<b>MOVING.</b>"],[5.0,"LET'S"],[5.3,"GET"],[5.6,"<b>BIGGER</b>"],[6.1,"TOGETHER."]];
  const cap = document.getElementById("caption");
  const groups = [[0,3],[3,7],[7,12],[12,16]];
  groups.forEach(([a,b], gi) => {
    const start = words[a][0], end = b < words.length ? words[b][0] : 8.4;
    tl.call(() => {}, null, start);
    tl.set(cap, { innerHTML: words.slice(a,b).map(w=>w[1]).join(" ") }, start);
    tl.fromTo(cap, { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.12, ease: "back.out(3)" }, start);
  });
  tl.set(cap, { innerHTML: "" }, 8.4);
  guy.finalize(tl, D);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
